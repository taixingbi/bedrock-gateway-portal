name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # No GATEWAY_API_URL needed here: every admin page is
      # force-dynamic (app/(app)/*/page.tsx), so Next.js never
      # attempts to execute them at build time to begin with --
      # confirmed locally, the build succeeds with the var unset.
      - run: npm run build

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bedrock-gateway-portal:ci .

      - name: Run container
        run: |
          docker run -d --name portal-ci -p 8080:8080 \
            -e GATEWAY_API_URL=http://localhost:1 \
            bedrock-gateway-portal:ci

      - name: Wait for /login
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/login > /dev/null; then
              echo "portal is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "portal did not become healthy in time"
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs portal-ci

      - name: Stop container
        if: always()
        run: docker rm -f portal-ci

  deploy-dev:
    name: Deploy to dev
    needs: [build, docker]
    # Auto-deploys on every push to main, same pattern as the other
    # three repos -- prod is never touched from this push at all, see
    # promote-prod.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_PORTAL_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev-portal
          ecs-cluster: gateway-dev-portal-cluster
          ecs-service: gateway-dev-portal-service
          task-definition-family: gateway-dev-portal
